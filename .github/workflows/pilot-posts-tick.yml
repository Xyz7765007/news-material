# Pilot Posts Tick — resume driver for the sidekick-posts pilot testers
# (six as of 2026-08-17: nirav, rishabh, sammy, rahul, roopam, kunal).
#
# WHY A SECOND TICK FILE INSTEAD OF EXTRA STEPS IN linkedin-posts-tick.yml.
# That workflow drives Material's scan and is load-bearing for a live client.
# Its budget is timeout-minutes: 7 against a curl that can hold for 350s;
# adding two more campaigns to the same job can exceed the timeout and start
# failing a run that Material depends on. Separate file, separate concurrency
# group, separate budget — Material's tick keeps working exactly as it did.
#
# WHAT THIS FIXES. A linkedin-posts scan processes ~22 leads per 300s function
# and then parks its progress in the campaign row. Nothing resumes it on its
# own. Without a tick covering these two campaigns, a scan started for Nirav or
# Rishabh advances one chunk and stops — looking, from the outside, exactly
# like a scan that is still running. That failure already cost a 6h silent
# stall once (2026-06-10, documented in linkedin-posts-tick.yml).
#
# Resume is a GET with key/base/campaign query params. The route's POST switch
# has NO resume mode; a POST bounces. Both campaigns are ticked every run and
# a campaign with no scan in flight returns IDLE, so this is a no-op except
# while a scan is actually going.
#
# Required secret: CRON_SECRET (already set on this repo for the other ticks).

name: Pilot Posts Tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pilot-posts-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # SIX campaigns x up to 350s each, plus slack. Must exceed the SUM, not the
    # single-curl budget, or the last campaign in the matrix is the one that
    # gets cut — and it would get cut silently, looking like an idle campaign.
    # Raised 25 -> 30 when Roopam was added on 2026-08-11: 5 x 350s is ~29
    # minutes, which the old ceiling did not cover. The matrix and the budget
    # have to move together or adding a tester quietly starves the last one.
    # Raised 30 -> 40 when Kunal was added on 2026-08-17: 6 x 350s is 35
    # minutes, so 30 would have cut HIS tick — the last entry in the matrix,
    # and the one that was just added to fix his coverage. Exactly the silent
    # starvation this comment has warned about twice now.
    #
    # In practice a tick costs nowhere near this: a campaign with no scan in
    # flight returns IDLE immediately, so the bill is ~350s for the one scan
    # actually running plus five instant no-ops. The ceiling only matters if
    # all six ever scan at once — and the cadence that now starts these scans
    # (sidekick-feed/.github/workflows/scan-cadence.yml) holds a 48-hour floor
    # per reader, so six simultaneous scans needs six readers to come due on
    # the same Monday. Possible, hence the headroom.
    #
    # WHY max-parallel STAYS 1 AT SIX CAMPAIGNS. Running them concurrently
    # would keep wall time flat, but the posts provider soft-rate-limits
    # parallel bulk fetching by returning empty HTTP 200 bodies rather than
    # 429s — which the scan records as "this lead has no posts" and marks done.
    # That failure is invisible and lossy (diagnosed 2026-06-22; see
    # .learnings/2026-06-22-linkedin-posts-silent-zero-fetch.md). A slower tick
    # is recoverable; a hollow scan is not.
    #
    # If all six do end up scanning together, this job can outlast the 5-minute
    # cron. That is survivable rather than a backlog: GitHub holds only ONE
    # pending run per concurrency group, so ticks get less frequent instead of
    # piling up. Onboarding testers one at a time avoids it entirely.
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: nirav
            base: app2dS8otxaHx346y
            campaign: recClRSVAnoS4xk7G
          - name: rishabh
            base: appefxdXz1pvF9L9i
            campaign: reczsqz4e3etoxNHj
          # Alpha testers added 2026-08-07.
          - name: sammy
            base: appVQ7oxmSZ2Q0B7z
            campaign: recLvKDhqGi5nLszm
          - name: rahul
            base: app4yPsHELEL3B88L
            campaign: recdGs1UDvopu83Mu
          # Alpha tester added 2026-08-11.
          - name: roopam
            base: apppThWqVVB9PvZgE
            campaign: reclb4SapKCZHZv9f
          # Kunal added 2026-08-17. He was the one person on sidekick-feed with
          # NO resume coverage, so a scan started for him advanced a single
          # chunk of ~22 leads and then stopped — indistinguishable from a scan
          # still running. That gap matters more now that sidekick-feed's
          # scan-cadence workflow starts these scans automatically; its tick
          # refuses to start a scan for any campaign missing from this matrix,
          # so this entry is what makes his cadence work at all.
          - name: kunal
            base: appPcAzAyMmtNNEmT
            campaign: recV0RlBHUmrhtVq2
    steps:
      - name: Resume tick (${{ matrix.name }})
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET secret not set"; exit 1; fi
          resp=$(curl -sS -m 350 \
            "https://news-material-two.vercel.app/api/linkedin-posts?key=$CRON_SECRET&base=${{ matrix.base }}&campaign=${{ matrix.campaign }}" \
            || echo '{"curl":"failed"}')
          echo "$resp" | head -c 2000
          case "$resp" in
            *'"curl":"failed"'*) echo "::warning::${{ matrix.name }} tick request failed";;
            *'"status":"running"'*) echo "::notice::${{ matrix.name }} processed a chunk";;
            *) echo "::notice::${{ matrix.name }} idle or scan not running";;
          esac
