# Wednesday scan — Material news + job posts + LinkedIn posts
#
# This is the automation that was documented but never existed (audited
# 2026-06-10: the Tasks table only grew on weeks someone clicked Scan in the
# UI). Runs scripts/wednesday-scan.py against the prod deployment.
#
# Setup (already true for outreach-cron): repo secret CRON_SECRET must match
# the Vercel CRON_SECRET env var.
#
# Triggers:
#   - cron: Wednesdays 06:00 UTC (11:30 IST)
#   - workflow_dispatch: manual re-run button (use after fixing an abort,
#     e.g. an OpenAI quota outage — the script exits 1 loudly on those)
#
# NOTE GH Actions cron can lag up to ~30 min at peak. A cron-job.org backup
# hitting workflow_dispatch (or simply re-running the scan) is the documented
# secondary trigger; see the SignalScope ops docs.

name: wednesday-scan

on:
  # ── SCHEDULE STOPPED 2026-08-17 (Samarth) ──
  # Material's weekly scan is run by hand now, so the automation was firing a
  # second scan on top of the manual one every Wednesday: duplicate RapidAPI
  # spend (one call per lead per run) and a Tasks table growing twice as fast
  # as anyone expected.
  #
  # DELIBERATELY COMMENTED, NOT DELETED. This file is the only place the
  # Material scan's arguments and its abort behaviour are written down, and
  # turning the automation back on should be uncommenting two lines rather
  # than reconstructing it. The manual route is unchanged: the Actions tab's
  # "Run workflow" button below, or the Scan button in the UI.
  #
  # NOTE the resume tick (linkedin-posts-tick.yml, every 5 minutes) is
  # deliberately LEFT RUNNING. It only ever continues a scan somebody already
  # started, and without it a manually-started Material scan advances one
  # chunk of ~22 leads and then stalls silently — the exact failure that cost
  # six hours in June.
  # schedule:
  #   - cron: "0 6 * * 3"
  workflow_dispatch:

concurrency:
  group: wednesday-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Wednesday scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SIGNALSCOPE_URL: https://news-material-two.vercel.app
        run: python scripts/wednesday-scan.py
